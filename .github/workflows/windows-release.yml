name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Windows application
        shell: pwsh
        run: |
          dotnet publish windows/app/CodexLidAwake.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output windows/publish `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            "0.0.0-dev"
          }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          & $compiler "/DMyAppVersion=$version" "windows/installer/CodexLidAwake.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexLidAwakeSetup
          path: release/CodexLidAwakeSetup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/CodexLidAwakeSetup.exe" `
            --repo "${{ github.repository }}" `
            --title "Codex Lid Awake ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
